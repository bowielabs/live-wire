<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Wirecraft">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe0c5"/>
      <stop offset="1" stop-color="#9d8bf2"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <rect x="190" y="170" width="140" height="172" rx="18"/>
    </clipPath>
  </defs>

  <!-- gradient background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- wires (dark, bold) -->
  <g stroke="#0c1322" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M 100 196 L 200 196"/>
    <path d="M 100 316 L 200 316"/>
    <path d="M 320 256 L 420 256"/>
  </g>

  <!-- gate body shadow -->
  <rect x="194" y="174" width="140" height="172" rx="18" fill="#0c1322" opacity="0.22"/>
  <!-- gate body -->
  <rect x="190" y="170" width="140" height="172" rx="18" fill="#0c1322"/>
  <!-- family-colour stripe at the top, clipped to the body's rounded corners -->
  <rect x="190" y="170" width="140" height="22" fill="#3fd6e0" clip-path="url(#bodyClip)"/>

  <!-- ports (filled green = "signal on") -->
  <g stroke="#0c1322" stroke-width="8">
    <circle cx="100" cy="196" r="26" fill="#37e08b"/>
    <circle cx="100" cy="316" r="26" fill="#37e08b"/>
    <circle cx="420" cy="256" r="26" fill="#37e08b"/>
  </g>
</svg>
