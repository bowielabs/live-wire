name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow only one deploy per ref at a time.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Idempotent: creates the project on the very first run, and harmlessly
        # fails-already-exists on every subsequent run (which is fine — the
        # next step is what actually deploys).
        run: npx --yes wrangler pages project create live-wire --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Project name and output dir come from wrangler.toml.
          # --branch marks the production deployment when on main; other
          # branches/PRs become preview deployments.
          # --commit-dirty=true silences wrangler's warning about dist/ being
          # untracked (it's gitignored on purpose).
          command: pages deploy --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
