<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="-10%" r="80%">
      <stop offset="0%" stop-color="#142036"/>
      <stop offset="100%" stop-color="#070b15"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#172238"/>
    </pattern>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe0c5"/>
      <stop offset="1" stop-color="#9d8bf2"/>
    </linearGradient>
  </defs>

  <!-- background layers -->
  <rect width="1200" height="630" fill="#070b15"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Mark (same gate silhouette as the favicon, scaled up) -->
  <g transform="translate(96, 195) scale(5)">
    <rect x="9" y="9" width="14" height="14" rx="2.5" fill="url(#markGrad)"/>
    <rect x="9" y="9" width="14" height="2.5" fill="#0c1322" fill-opacity="0.45"/>
    <circle cx="5" cy="12" r="1.7" fill="#37e08b"/>
    <circle cx="5" cy="20" r="1.7" fill="#37e08b"/>
    <circle cx="27" cy="16" r="1.7" fill="#37e08b"/>
  </g>

  <!-- Wordmark -->
  <text x="270" y="290"
        font-family="Space Grotesk, system-ui, -apple-system, Helvetica, sans-serif"
        font-size="120" font-weight="700" fill="#dde6f7" letter-spacing="-2.5">
    Live Wire
  </text>

  <!-- Tagline -->
  <text x="100" y="395"
        font-family="Space Grotesk, system-ui, -apple-system, Helvetica, sans-serif"
        font-size="30" font-weight="400" fill="#9aa9c4">
    Wire the gates. Light up the signals.
  </text>

  <!-- Sub-tagline (mono, tracked) -->
  <text x="100" y="445"
        font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
        font-size="18" fill="#5d6e92" letter-spacing="2">
    100 LEVELS · LOGIC GATES · DISCRETE MATHS · NAND-ONLY ADDER
  </text>

  <!-- Decorative current-flow band: lit wire with port dots -->
  <g transform="translate(100, 555)">
    <line x1="0" y1="0" x2="420" y2="0"
          stroke="#37e08b" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="420" y2="0"
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="10 16" opacity="0.75"/>
    <circle cx="0" cy="0" r="9" fill="#37e08b" stroke="#0c1322" stroke-width="2"/>
    <circle cx="420" cy="0" r="9" fill="#37e08b" stroke="#0c1322" stroke-width="2"/>
  </g>

  <!-- URL bottom-right -->
  <text x="1104" y="565" text-anchor="end"
        font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
        font-size="22" fill="#8294b6" letter-spacing="1">live-wire.pages.dev</text>
</svg>
